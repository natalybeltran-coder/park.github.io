<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - The Parking Cun</title>
    <link rel="stylesheet" href="style-inicio_sesion.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>The Parking Cun</h2>
            <img src="img/logotipo .png.webp" alt="" class="logo-img">
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="inicio_sesion.html">Ingresar</a>
        </nav>
    </header>

    <section>
        <div class="formulario">
            <form>
                <fieldset>
                    <h1>Inicio De Sesión</h1>
                    <input type="email" id="correo" placeholder="Ingrese Correo" required>
                    <input type="password" id="contraseña" placeholder="Ingrese Contraseña" required>
                    <div>
                        <input type="button" value="Aceptar" onclick="cargar()">
                        <a href="formulario.html">Registrar Usuario</a>
                        <button type="button" onclick="limpiarCampos()">Cancelar</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </section>

    <footer>
        <div class="final">
            <h1>Déjanos Saber Tus Comentarios</h1>
            <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSed9SCsIGxgvAc0t9fyqH8n0oyFf3_u2uRIF2CYADHU9i4OAg/viewform?usp=sf_link">formularios</a></p>
            <img src="img/imagen9.jpg" alt="imagen9">
            <img src="img/imagen10.png" alt="imagen10">
            <img src="img/imagen11.jpg" alt="imagen11">
        </div>
    </footer>

    <script>
    function cargar() {
        const correo = document.getElementById("correo").value.trim();
        const contrasena = document.getElementById("contraseña").value.trim();

        // Validar credenciales (puedes cambiarlas por las tuyas)
        if (
            (correo === "admin@parkingcun.com" && contrasena === "12345") ||
            (correo === "user@example.com" && contrasena === "password")
        ) {
            alert("¡Inicio de sesión exitoso!");
            window.location.href = "mapeo.html"; // redirige si es correcto
        } else {
            alert("Correo o contraseña incorrectos. Intenta de nuevo.");
        }
    }

    function limpiarCampos() {
        document.getElementById("correo").value = "";
        document.getElementById("contraseña").value = "";
    }
    </script>
</body>
</html>
